name: external-links

on:
  schedule:
    - cron: "17 5 * * 1" # every Monday, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    name: external-links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sources cited in the documentation must stay reachable. This runs on a
      # schedule, not on pull requests, so a third-party outage never blocks a merge.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress "./**/*.md"
          fail: true
